<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỷ Niệm Về Ông Nội Đào Huy Việt — Truy Cập Riêng Tư</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #F2EBD9;
      --dark:      #2B4A3D;
      --accent:    #A0617A;
      --gold:      #C9A880;
      --text:      #2C2016;
      --text-s:    #5A4035;
      --cream:     #F5EDE0;
      --font-h:    'Playfair Display', Georgia, serif;
      --font-b:    'Lora', Georgia, serif;
      --font-d:    'Dancing Script', cursive;
    }

    html, body {
      height: 100%;
      font-family: var(--font-b);
      background: linear-gradient(135deg, #1E3B30 0%, #2B4A3D 50%, #1E3B30 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    /* Particle dots overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23A0617A' fill-opacity='0.06'%3E%3Ccircle cx='30' cy='30' r='1'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .gate-card {
      background: var(--cream);
      border-radius: 16px;
      padding: 3.5rem 3rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(160, 97, 122, 0.25);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(201,168,128,0.15);
      animation: fadeUp .6s ease-out;
      position: relative;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .gate-ornament {
      color: var(--accent);
      font-size: 1.1rem;
      letter-spacing: .7rem;
      opacity: .8;
      margin-bottom: 1.5rem;
    }

    .gate-title {
      font-family: var(--font-h);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      color: var(--text);
      font-weight: 600;
      margin-bottom: .4rem;
      line-height: 1.3;
    }

    .gate-years {
      font-family: var(--font-h);
      font-size: .95rem;
      color: var(--accent);
      letter-spacing: .22em;
      margin-bottom: 1.4rem;
    }

    .gate-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 1rem; margin: 1.4rem 0;
    }
    .gate-divider span { display: block; height: 1px; width: 70px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    .gate-divider em { color: var(--accent); font-size: .6rem; font-style: normal; }

    .gate-desc {
      font-size: .92rem;
      color: var(--text-s);
      line-height: 1.8;
      font-style: italic;
      margin-bottom: 2rem;
      padding: 1rem 1.2rem;
      background: rgba(160,97,122,.07);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .gate-label {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--text-s);
      font-weight: 600;
      margin-bottom: .6rem;
      text-align: left;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 1.2rem;
    }

    .gate-input {
      width: 100%;
      padding: .9rem 3rem .9rem 1.2rem;
      border: 2px solid rgba(160,97,122,.3);
      border-radius: 10px;
      font-family: var(--font-b);
      font-size: 1.3rem;
      letter-spacing: .35em;
      text-align: center;
      color: var(--text);
      background: white;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }

    .gate-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(160,97,122,.15);
    }

    .gate-input.error {
      border-color: #c0392b;
      animation: shake .35s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }

    /* Toggle show/hide */
    .toggle-eye {
      position: absolute; right: .9rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-s); opacity: .6;
      transition: opacity .2s;
      padding: .2rem;
    }
    .toggle-eye:hover { opacity: 1; }

    .error-msg {
      font-size: .82rem;
      color: #c0392b;
      margin-bottom: 1rem;
      min-height: 1.2em;
      transition: opacity .25s;
    }

    .gate-btn {
      width: 100%;
      padding: .95rem 1.5rem;
      background: var(--dark);
      color: var(--cream);
      border: none;
      border-radius: 10px;
      font-family: var(--font-b);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .05em;
      cursor: pointer;
      transition: all .3s;
      position: relative;
      overflow: hidden;
    }

    .gate-btn:hover {
      background: #3A5E50;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(43,74,61,.35);
    }

    .gate-btn:active { transform: translateY(0); }

    .gate-btn.loading {
      pointer-events: none;
      background: #3A5E50;
    }
    .gate-btn.loading::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

    .gate-hint {
      margin-top: 1.5rem;
      font-size: .78rem;
      color: var(--text-s);
      opacity: .7;
      line-height: 1.6;
    }
    .gate-hint strong { color: var(--accent); }

    .gate-footer-ornament {
      color: var(--accent);
      font-size: .9rem;
      letter-spacing: .6rem;
      opacity: .5;
      margin-top: 1.8rem;
    }
  </style>
</head>
<body>

<div class="gate-card">
  <div class="gate-ornament">✦ ✦ ✦</div>

  <h1 class="gate-title">Đào Huy Việt</h1>
  <p class="gate-years">1934 — 2010</p>

  <div class="gate-divider">
    <span></span><em>◆</em><span></span>
  </div>

  <p class="gate-desc">
    Đây là trang lưu giữ ký ức riêng tư của gia đình.<br>
    Vui lòng nhập mật khẩu để tiếp tục.
  </p>

  <div class="gate-label">Mật khẩu truy cập</div>

  <div class="input-wrap">
    <input
      type="password"
      id="pw-input"
      class="gate-input"
      placeholder="••••••••"
      maxlength="20"
      autocomplete="off"
      autofocus
    >
    <button class="toggle-eye" id="toggle-eye" title="Hiện/Ẩn mật khẩu" type="button">
      <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <div class="error-msg" id="err-msg"></div>

  <button class="gate-btn" id="enter-btn" type="button">
    <span id="btn-text">Vào trang kỷ niệm →</span>
  </button>

  <p class="gate-hint">
    Gợi ý: <strong>Ngày xảy ra sự kiện ngôi nhà tại phố Nguyễn Thiệp</strong>
  </p>

  <div class="gate-footer-ornament">✦</div>
</div>

<script>
  const HASH_CORRECT = '90e39b6c8e0c8c3c2e9e5f9e02b9e9f4d7e2c1a3b5d7f9e1c3a5b7d9f1e3a5b7'; // sha256 placeholder
  const SECRET = '13121966';

  const inp   = document.getElementById('pw-input');
  const btn   = document.getElementById('enter-btn');
  const err   = document.getElementById('err-msg');
  const eye   = document.getElementById('toggle-eye');
  const eyeIc = document.getElementById('eye-icon');

  /* Toggle show/hide password */
  eye.addEventListener('click', () => {
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    eyeIc.innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  /* Enter key support */
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });

  btn.addEventListener('click', tryEnter);

  function tryEnter() {
    err.textContent = '';
    inp.classList.remove('error');

    if (!inp.value.trim()) {
      showError('Vui lòng nhập mật khẩu.');
      return;
    }

    btn.classList.add('loading');
    document.getElementById('btn-text').style.visibility = 'hidden';

    /* Slight delay for UX (simulates checking) */
    setTimeout(() => {
      if (inp.value === SECRET) {
        sessionStorage.setItem('dhv_auth', 'ok');
        window.location.href = 'index.html';
      } else {
        btn.classList.remove('loading');
        document.getElementById('btn-text').style.visibility = '';
        showError('Mật khẩu không đúng. Vui lòng thử lại.');
        inp.value = '';
        inp.focus();
      }
    }, 600);
  }

  function showError(msg) {
    err.textContent = msg;
    inp.classList.add('error');
    setTimeout(() => inp.classList.remove('error'), 400);
  }
</script>

</body>
</html>
